<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מחולל דוחות | קרן קרן פיננסים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tools.css" />
  <link rel="stylesheet" href="../css/report.css" />
</head>
<body>
  <header class="tool-header no-print">
    <div class="tool-header-inner">
      <div class="tool-brand">
        <div class="tool-brand-mark">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M24 6L38 14V24C38 32 31 39.5 24 42C17 39.5 10 32 10 24V14L24 6Z" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18 24L22 28L30 20" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1>מחולל דוחות</h1>
          <p>קרן קרן | פיננסים</p>
        </div>
      </div>
      <div class="tool-header-actions">
        <a href="index.html" class="btn btn-ghost btn-sm">← ארגז הכלים</a>
        <button class="btn btn-outline btn-sm" onclick="loadDemo()">מילוי לדוגמה</button>
        <button class="btn btn-navy btn-sm" onclick="window.print()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          הדפסה / PDF
        </button>
      </div>
    </div>
  </header>

  <main class="tool-main">
    <div class="container report-layout">

      <!-- ============ EDITOR ============ -->
      <section class="report-editor no-print">
        <div class="page-intro">
          <h2>מחולל דוחות</h2>
          <p>מלאי את פרטי הלקוח והפוליסות — הדוח מתעדכן בזמן אמת. בסיום: הדפסה או שמירה כ‑PDF.</p>
        </div>

        <div class="panel">
          <div class="panel-title"><span class="num">1</span> פרטי הלקוח</div>
          <div class="grid-2">
            <div class="field"><label>שם מלא</label><input id="f-name" data-bind placeholder="ישראל ישראלי" /></div>
            <div class="field"><label>תעודת זהות</label><input id="f-id" data-bind placeholder="000000000" inputmode="numeric" /></div>
          </div>
          <div class="grid-2">
            <div class="field"><label>טלפון</label><input id="f-phone" data-bind placeholder="050-0000000" inputmode="tel" /></div>
            <div class="field"><label>תאריך הדוח</label><input id="f-date" data-bind type="date" /></div>
          </div>
          <div class="field"><label>כותרת הדוח</label><input id="f-title" data-bind placeholder="דוח מצב פיננסי — סקירה תקופתית" /></div>
        </div>

        <div class="panel">
          <div class="panel-title"><span class="num">2</span> פוליסות ומוצרים</div>
          <div id="policyEditor"></div>
          <button class="btn btn-outline btn-sm" onclick="addPolicy()">＋ הוספת פוליסה</button>
        </div>

        <div class="panel">
          <div class="panel-title"><span class="num">3</span> הערות והמלצות</div>
          <div class="field"><label>סיכום הסוכנת (יופיע בתחתית הדוח)</label>
            <textarea id="f-summary" data-bind placeholder="לדוגמה: מומלץ לבחון הפחתת דמי ניהול בקרן ההשתלמות ולהגדיל את ההפקדה החודשית לפנסיה לקראת פרישה."></textarea>
          </div>
        </div>
      </section>

      <!-- ============ PREVIEW / PRINTABLE ============ -->
      <section class="report-preview-wrap">
        <div class="report-preview-label no-print">תצוגה מקדימה</div>
        <div id="report" class="report-doc">
          <!-- filled by JS -->
        </div>
      </section>
    </div>
  </main>

  <div class="toast no-print" id="toast"></div>
  <script src="../js/report.js"></script>
</body>
</html>
